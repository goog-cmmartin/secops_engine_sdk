<style>
* { box-sizing: border-box; }
body {

  flex-direction: column;
  height: 100vh;
}
body > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: #1e293b;
  color: #f8fafc;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; color: #38bdf8; }
.muted { color: #94a3b8; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 6px 10px;
  border: 1px solid #475569;
  border-radius: 6px;
  background: #0f172a;
  color: #f8fafc;
}
.controls input { width: 240px; }
.controls button { cursor: pointer; background: #334155; }
.controls button:hover { background: #475569; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 65%;
  background: #0b0f19;
  border-right: 1px solid #1e293b;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 35%;
  overflow-y: auto;
  padding: 20px 24px;
  background: #ffffff;
  color: #0f172a;
}
#detail-empty {
  text-align: center;
  margin-top: 50px;
  color: #64748b;
}

.detail-header { margin-bottom: 14px; }
.detail-header h1 {
  font-size: 20px;
  margin: 6px 0 4px;
  font-weight: 700;
  color: #0f172a;
}
.type-chip {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.trust-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 6px;
}
.trust-human { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
.trust-machine { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; }
.trust-unverified { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

dl.frontmatter {
  display: grid;
  grid-template-columns: 100px 1fr;
  row-gap: 6px;
  column-gap: 12px;
  margin: 12px 0 16px;
  font-size: 13px;
  background: #f1f5f9;
  padding: 12px;
  border-radius: 8px;
}
dl.frontmatter dt {
  color: #475569;
  font-weight: 600;
}
dl.frontmatter dd {
  margin: 0;
  word-break: break-all;
}
#detail-body {
  line-height: 1.6;
  font-size: 14px;
}
#detail-body pre {
  background: #0f172a;
  color: #f8fafc;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
}
#detail-body code {
  background: #f1f5f9;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 13px;
}
#detail-body pre code {
  background: transparent;
  padding: 0;
}
.tag-badge {
  display: inline-block;
  background: #e2e8f0;
  color: #334155;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 11px;
  margin-right: 4px;
}
</style>

      </dl>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:16px 0;">
      <div id="detail-body"></div>
    </article>
  </section>
</main>

loud_monitoring", "source": "tasks/platform_engineer/monitor_chronicle_gcp_telemetry", "target": "features/gcp/cloud_monitoring"}}, {"data": {"id": "tasks/platform_engineer/monitor_chronicle_gcp_telemetry__personas/platform_engineer", "source": "tasks/platform_engineer/monitor_chronicle_gcp_telemetry", "target": "personas/platform_engineer"}}, {"data": {"id": "tasks/soc_analyst/audit_soar_playbook_decay__concepts/soar_case_lifecycle", "source": "tasks/soc_analyst/audit_soar_playbook_decay", "target": "concepts/soar_case_lifecycle"}}, {"data": {"id": "tasks/soc_analyst/audit_soar_playbook_decay__features/soar/playbooks", "source": "tasks/soc_analyst/audit_soar_playbook_decay", "target": "features/soar/playbooks"}}, {"data": {"id": "tasks/soc_analyst/audit_soar_playbook_decay__personas/soc_analyst", "source": "tasks/soc_analyst/audit_soar_playbook_decay", "target": "personas/soc_analyst"}}, {"data": {"id": "tasks/soc_analyst/triage_high_priority_cases__concepts/soar_case_lifecycle", "source": "tasks/soc_analyst/triage_high_priority_cases", "target": "concepts/soar_case_lifecycle"}}, {"data": {"id": "tasks/soc_analyst/triage_high_priority_cases__features/soar/case_management", "source": "tasks/soc_analyst/triage_high_priority_cases", "target": "features/soar/case_management"}}, {"data": {"id": "tasks/soc_analyst/triage_high_priority_cases__features/soar/playbooks", "source": "tasks/soc_analyst/triage_high_priority_cases", "target": "features/soar/playbooks"}}, {"data": {"id": "tasks/soc_analyst/triage_high_priority_cases__personas/soc_analyst", "source": "tasks/soc_analyst/triage_high_priority_cases", "target": "personas/soc_analyst"}}], "bodies": {"computations/feed_timestamp_skew": "# Computation\n\n```sql\nrule feed_timestamp_skew {\n  meta:\n    description = \"Audit ingestion pipeline clock skew and transport delay across all feeds\"\n    severity = \"INFORMATIONAL\"\n    author = \"SecOps Engine SDK\"\n  events:\n    $e.metadata.event_timestamp.seconds > 0\n  match:\n    $e.metadata.log_type over 1h\n  outcome:\n    $event_count = count($e.metadata.id)\n    $avg_latency_minutes = avg(($e.metadata.collected_timestamp.seconds - $e.metadata.event_timestamp.seconds) / 60)\n    $clock_skew_count = count(if($e.metadata.collected_timestamp.seconds < $e.metadata.event_timestamp.seconds, 1, 0))\n  condition:\n    $e\n}\n```\n\nThis sanctioned computation calculates three invariant health metrics:\n1. **Total Ingested Volume:** Total count of UDM events partitioned by `metadata.log_type`.\n2. **Mean Transport Latency:** Average minutes between source emission (`event_timestamp`) and ingestion ingestion receipt (`collected_timestamp`).\n3. **Negative Delta (Clock Skew):** Events where `collected_timestamp < event_timestamp`, indicating skewed endpoint clocks or misconfigured parser timezone offsets.\n\n# Verification & Attestation\n\nThe attester at `knowledge/attesters/yaral_equality.py` validates the receipt generated by `knowledge/tasks/ingestion_specialist/audit_feed_health.md`:\n1. **Provenance:** Verifies `receipt.query_text` precisely matches the YARA-L 2 rule defined above (whitespace, keywords, and comments normalized).\n2. **Fidelity:** Confirms displayed metrics correspond directly to `receipt.result_rows`.", "concepts/bindplane_telemetry_architecture": "# BindPlane OP OpenTelemetry Collection Architecture\n\n## 1. Overview & Mental Model\nBindPlane OP manages fleets of OpenTelemetry (OTel) collectors across multi-cloud and on-premises environments. It decouples telemetry generation from destination ingestion by providing a central control plane for agent configuration, filtering processors, and rollout management.\n\n## 2. Ingestion Pipeline Funnel\nA BindPlane telemetry pipeline consists of three core components:\n1. **Sources:** Inputs capturing system logs (e.g., Windows Event Logs, Syslog, Fluent, Kafka).\n2. **Processors:** Pipeline stages performing local filtering, masking sensitive fields, sampling, and batching.\n3. **Destinations:** Ingestion endpoints routing data to Chronicle HTTP feeds, Google Cloud Pub/Sub, or Google Cloud Storage.\n\n## 3. Rollout Safety & Canary Stages\n- **Progressive Rollout:** When deploying configuration updates to thousands of agents, rollouts proceed in stages (e.g. 5% canary &rarr; 25% &rarr; 100%).\n- **Error Backoff:** If canary agents experience elevated crash loops or network buffer exhaustion, rollouts automatically pause to prevent fleet-wide log loss.", "concepts/detection_lifecycle": "# YARA-L Rule Engine & Curated Detections Lifecycle\n\n## 1. Overview & Mental Model\nGoogle SecOps provides two detection tiers:\n1. **Customer-Authored YARA-L Rules:** Custom rules supporting single-event matching and multi-event sliding window correlations.\n2. **Google Curated Detections:** Vendor-maintained rule packs maintained by Mandiant and Google threat intelligence teams, mapped to MITRE ATT&CK.\n\n## 2. Rule Execution States & Scheduling\n- **Frequency:** Live rules run on recurring schedules (e.g., 10 minutes, hourly, daily).\n- **Execution Latency:** Multi-event correlation rules with wide sliding windows (`match` variables over 24-48 hours) consume higher execution capacity.\n- **Zero-Match Rules:** Rules that evaluate continuously but generate zero alerts over long periods may be misconfigured, referencing retired log types, or missing prerequisite UDM fields.\n\n## 3. Curated Rule Drift & Retrenchment\nGoogle regularly updates curated packs\u2014deploying new detections for emerging threat campaigns and retiring rules that generate excessive false positives or have been superseded. SOC engineering teams must monitor weekly curated drift to ensure coverage remains stable.", "concepts/ingestion_pipeline_topology": "# Log Ingestion Pipeline Topology & Latency Dynamics\n\n## 1. Overview & Mental Model\nTelemetry enters Google SecOps through multiple ingestion paths: BindPlane OP OpenTelemetry agents, GCP Cloud Logging Pub/Sub exports, direct API ingestion, and native pull feeds (e.g., S3, Azure Blob, Office 365). \n\nUnderstanding the pipeline topology is essential for isolating latency:\n1. **Source Generation:** System emits log (`metadata.event_timestamp`).\n2. **Collection & Transport:** Agent or collector buffers and transports to intermediate queues (e.g., GCP Pub/Sub, BindPlane OP).\n3. **Chronicle Feed Receipt:** Chronicle pull/push feed ingests payload.\n4. **Ingestion Pipeline & Normalization:** Chronicle extracts fields via Parser and maps to UDM (`metadata.ingested_timestamp`).\n\n## 2. Ingestion Latency vs Event Latency\n- **Event Latency ($T_{ingested} - T_{event}$):** Represents delay between event occurrence and indexing in Chronicle. Delays exceeding 2 hours degrade detection timeliness.\n- **Transport Latency:** Delay between collector batch flushes.\n- **Processing Queue Latency:** Backlog inside Chronicle ingestion queues during volume spikes.\n\n## 3. Operational Guarantees & Constraints\n- **Late-Arriving Data Buffer:** YARA-L rules rely on execution schedules that accommodate late data. Setting late-arriving buffers to 0 seconds risks missing delayed telemetry.\n- **Feed Error Quotas:** Feeds encountering continuous authentication or schema failures enter degraded or failed states.", "concepts/soar_case_lifecycle": "# SOAR Case Lifecycle, Alert Grouping & Playbook Execution\n\n## 1. Overview & Mental Model\nChronicle SIEM detections and external security alerts flow into Chronicle SOAR as raw alerts. Alerts are grouped into **Cases** based on configurable grouping rules (e.g., shared entity, time window, rule category). \n\n## 2. Case Stages & Automation Flow\n1. **Ingestion & Alert Grouping:** Alerts arrive via Chronicle Alerts Connector and are grouped into a Case.\n2. **Automatic Triage & Playbook Trigger:** Associated playbooks trigger automatically upon case creation, enriching entities (VirusTotal, Active Directory, DNS).\n3. **Analyst Investigation:** Analysts review the Case Wall, timeline, and automated recommendations.\n4. **Resolution & Closure:** Case is closed with structured root-cause classification and closing reason definitions.\n\n## 3. Operational Guarantees & SLA Compliance\n- Cases carry priority-based SLA targets (Critical, High, Medium, Low).\n- Playbook execution timeouts or connector credential failures stall automated triage, causing SLA breaches.", "concepts/udm_search_lifecycle": "# UDM Search Execution Lifecycle & Query Optimization\n\n## 1. Overview & Mental Model\nUnified Data Model (UDM) search executes against Google SecOps' distributed columnar event store. When an analyst or agent submits a search query, the engine parses the expression, determines whether filters target indexed fields (e.g., `principal.ip`, `target.user.userid`) or unindexed attributes, and plans execution across time partition buckets.\n\n## 2. Architecture & Performance Topology\nUDM search performance is driven by three primary factors:\n1. **Time Range Partitioning:** Queries constrained to narrower windows (e.g., 24 hours vs 30 days) execute orders of magnitude faster.\n2. **Indexed Filter Selectivity:** Filtering on indexed fields allows partition pruning before scanning unindexed fields.\n3. **Ingestion Latency Alignment:** Searches expecting real-time event matches can produce false negatives if upstream ingestion latency exceeds the query lookback window.\n\n## 3. Operational Guarantees & Constraints\n- **Timeout Limits:** Interactive searches have a hard execution cutoff (typically 300 seconds).\n- **Page Size Limits:** Results page size is bounded (standard page size 100 to 1,000 items).\n- **Quota Throttling:** Rapid sequential or parallel unbounded queries trigger tenant API concurrency limits.\n\n## 4. Cross-System Dependencies\n- **SecOps Dashboards:** Health Hub monitors query execution latency (p50, p95) and error spikes.\n- **Log Feeds:** Feed ingestion delays directly impact search result freshness.", "concepts/workforce_identity_federation": "# Workforce Identity Pools & SecOps Role Governance\n\n## 1. Overview & Mental Model\nGoogle SecOps supports external identity provider (IdP) federation via **GCP Workforce Identity Pools** (e.g., Okta, Azure AD / Entra ID, PingIdentity). Rather than syncing individual user credentials into Google Cloud, external SAML/OIDC tokens are exchanged for short-lived Google OAuth tokens via Security Token Service (STS).\n\n## 2. Role Mapping & Privilege Hierarchy\nFederated users inherit SecOps access through IAM role bindings attached to workforce pool attributes (e.g., `principalSet://iam.googleapis.com/locations/global/workforcePools/na-sdl-pool/group/secops-admins`):\n- **Chronicle Admin (`roles/chronicle.admin`):** Full administrative control over YARA-L rules, feeds, parsers, and global settings.\n- **Federation Admin (`roles/chronicle.federationAdmin`):** Authority to configure and manage identity pool mappings and group synchronizations.\n- **SOAR Admin (`roles/chronicle.soarAdmin`):** Full authority across SOAR environments, integrations, playbooks, and case configurations.\n- **Data RBAC Scopes:** Restricts federated users to specific log types, namespaces, or customer compartments via UDM data labels.\n\n## 3. Operational Guarantees & Constraints\n- External session durations are constrained by STS token lifetimes (typically 1 to 12 hours).\n- Inactive accounts or revoked IdP group memberships immediately lose access upon token refresh.", "features/bindplane/agent_fleet": "# BindPlane OP Collector Fleets & Pipeline Ingestion\n\n## 1. Feature Purpose & Scope\nProvides operational visibility into BindPlane agent fleets and connects agent health directly to downstream Chronicle SIEM feed ingestion health.\n\n## 2. Underlying APIs & SDK Primitives\n- **Feed Ingestion Health:** `feed.audit_health` correlates feed status with upstream collector transmission.\n- **Feed Configuration:** `feed.search` and `feed.get` identify collector-driven Chronicle endpoints.\n\n## 3. Input Parameters & Constraints\n- **Agent Health State:** Track active, disconnected, and error states.\n- **Canary Thresholds:** Maximum acceptable failure rate during progressive rollouts (< 1.0%).\n\n## 4. Telemetry & Observable Health Indicators\n- Ingestion latency spikes correlating with agent buffer backlog.\n- Collector heartbeat disconnects.", "features/gcp/cloud_logging": "# Google Cloud Logging Audit & SecOps Diagnostic Trails\n\n## 1. Feature Purpose & Scope\nProvides unified querying and search across Google Cloud Logging (`logging.googleapis.com/v2/entries:list`) for Chronicle SIEM & SOAR audit trails, forwarder error logs, API error diagnostics, and administrative operations.\n\n## 2. Underlying APIs & SDK Primitives\n- **Query Cloud Logging Entries:** `gcp_logging.search` (`POST v2/entries:list`)\n  - Target projects: Chronicle tenant Google Cloud project.\n  - Filters: Supports Cloud Logging Advanced Filter syntax (e.g. `severity >= ERROR`, `resource.type = \"chronicle.googleapis.com/...\"`, `logName : \"cloudaudit.googleapis.com\"`).\n  - Normalization: Extends `UniversalBatchMixin` returning normalized `GcpLogEntry` objects.\n\n## 3. Input Parameters & Constraints\n- **Filter Expression:** String filter defining resource types, timestamps, severity, and text/proto payloads.\n- **Order:** Defaults to descending timestamp order (`timestamp desc`).\n- **Cardinality:** Bounded collection query with explicit page sizes.\n\n## 4. Telemetry & Observable Health Indicators\n- Detect high-severity errors from Chronicle forwarder agents (`chronicle.googleapis.com/agent`).\n- Monitor API authorization failures and permission denied errors (`Code 7 / 403`).\n- Track administrative changes and role updates in Cloud Audit activity logs.", "features/gcp/cloud_monitoring": "# Google Cloud Monitoring Time Series & Chronicle Telemetry\n\n## 1. Feature Purpose & Scope\nProvides operational metrics and time series query capabilities across Google Cloud Monitoring (`monitoring.googleapis.com/v3/projects/{project_id}/timeSeries`) to track Chronicle SIEM ingestion volume, normalizer throughput, API request consumption, and forwarder agent performance.\n\n## 2. Underlying APIs & SDK Primitives\n- **Query Time Series:** `gcp_monitoring.time_series` (`GET v3/projects/{project_id}/timeSeries`)\n  - Supported metric domains:\n    - Collector ingestion: `chronicle.googleapis.com/collector/ingestion/total_ingested_log_count`, `total_ingested_log_size`\n    - Normalizer throughput: `chronicle.googleapis.com/normalizer/throughput/total_record_count`, `total_event_count`\n    - Service API usage: `serviceruntime.googleapis.com/api/request_count` filtered by `resource.label.service = \"chronicle.googleapis.com\"`\n    - Agent health: `chronicle.googleapis.com/agent/cpu_seconds`, `chronicle.googleapis.com/agent/exporter_queue_size`\n\n## 3. Input Parameters & Constraints\n- **Filter Expression:** Metric type filter (e.g. `metric.type = starts_with(\"chronicle.googleapis.com/\")`).\n- **Interval:** RFC3339 start and end timestamps or dynamic lookback window (`hours`).\n- **Aggregation:** Alignment period (e.g. `3600s`), per-series aligner (`ALIGN_SUM`, `ALIGN_RATE`), and cross-series reducers.\n- **Cardinality:** Bounded time series query.\n\n## 4. Telemetry & Observable Health Indicators\n- Sudden drops in ingestion count or volume indicating forwarder disconnections.\n- Normalizer event count anomalies diverging from raw ingested record counts.\n- High error rates on API request counts indicating quota limits or authentication timeouts.", "features/gcp/workforce_identity": "# GCP Workforce Identity Pools & Data RBAC Context\n\n## 1. Feature Purpose & Scope\nProvides operational visibility into federated access controls, identity pool groups, and row-level data access restrictions across Google SecOps and GCP.\n\n## 2. Underlying APIs & SDK Primitives\n- **Retrieve Effective RBAC Context:** `data_rbac.environment.search` (`GET v1alpha/{parent}:getDataAccessContext`)\n- **Query Data Access Scopes:** `data_rbac.scope.search` (`GET v1alpha/{parent}/dataAccessScopes`)\n- **Inspect Data Access Labels:** `data_rbac.label.search` (`GET v1alpha/{parent}/dataAccessLabels`)\n\n## 3. Input Parameters & Constraints\n- **Scope ID:** Targets specific compartment scopes assigned to workforce groups.\n- **Cardinality:** Bounded collection lists.\n\n## 4. Telemetry & Observable Health Indicators\n- Monitor unauthorized 403 API spikes in GCP Cloud Logging for workforce pool principals.\n- Track stale group mappings where federated groups have no corresponding active SecOps users.", "features/siem/curated_detections": "# Google Curated Detections & Rule Tuning\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to Google Curated Detections & Rule Tuning within secops_siem.\n\n## 2. Capabilities & SDK Workflows\n### `curated_detections.search_rulesets`\n- **Description:** Discovers and searches Google SecOps Curated Rule Sets with MITRE ATT&CK mappings and log sources.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_curated_rulesets`\n\n### `curated_detections.get_ruleset`\n- **Description:** Deep-inspects a Curated Rule Set, its broad/precise deployments, member rules, and detection telemetry.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_curated_ruleset`\n\n### `curated_detections.get_rule`\n- **Description:** Retrieves an individual Curated Rule, its MITRE techniques, false positives, and raw YARA-L logic.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_curated_rule`\n\n### `curated_detections.metrics`\n- **Description:** Aggregates detection firing counts and retrieves tenant-wide rule quotas and telemetry.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_curated_detection_metrics`\n\n### `curated_detections.set_deployment`\n- **Description:** Updates enabled and alerting states for a Curated Rule Set precision deployment.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `set_curated_ruleset_deployment`\n\n### `curated_detections.audit_health`\n- **Description:** Performs a comprehensive deployment posture audit, detects misconfigurations like broad alerting, identifies top firing rules, and ranks newest/oldest content.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `audit_curated_detections_health`\n\n### `curated_detections.refinements.list`\n- **Description:** Lists active UDM findings refinements and detection exclusions across the tenant.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_findings_refinements`\n\n### `curated_detections.refinements.test`\n- **Description:** Simulates and dry-runs an exclusion query against historical detections to compute noise suppression ratio.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `test_findings_refinement`\n\n### `curated_detections.refinements.create`\n- **Description:** Creates a new UDM findings refinement exclusion for curated rules or tenant-wide detections.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `create_findings_refinement`\n\n### `curated_detections.refinements.delete`\n- **Description:** Removes an active UDM findings refinement exclusion.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `delete_findings_refinement`\n\n### `curated_detections.tuning.top_noisy_rules`\n- **Description:** Aggregates and ranks top firing detection rules with alert state, volume, and Google vs Customer rule classification.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `find_top_noisy_rules`\n\n### `curated_detections.tuning.entity_cardinality`\n- **Description:** Profiles multi-dimensional entity subfield distributions (IPs, hostnames, users, processes, DNS) for a detection rule.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `analyze_entity_cardinality`\n\n### `curated_detections.tuning.case_history`\n- **Description:** Cross-references historical SOAR cases associated with a detection rule to extract analyst resolutions and root causes.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `cross_reference_rule_cases`\n\n### `curated_detections.tuning.diagnose`\n- **Description:** End-to-end autonomous workflow that analyzes noisy rules, profiles cardinality, cross-references SOAR cases, formulates exclusions, and dry-run tests suppression.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `tune_detection`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/siem/data_rbac": "# SIEM Data RBAC & Scope Permissions\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SIEM Data RBAC & Scope Permissions within secops_siem.\n\n## 2. Capabilities & SDK Workflows\n### `data_rbac.scope.search`\n- **Description:** Discovers and filters Data Access RBAC Scopes and allow/deny label counts.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_data_access_scopes`\n\n### `data_rbac.scope.get`\n- **Description:** Retrieves deep configuration of a Data Access Scope including label attachments.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_data_access_scope`\n\n### `data_rbac.label.search`\n- **Description:** Discovers Data Access Labels and their associated UDM filter query definitions.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_data_access_labels`\n\n### `data_rbac.label.get`\n- **Description:** Retrieves full configuration of a Data Access Label including UDM filter expression.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_data_access_label`\n\n### `data_rbac.environment.search`\n- **Description:** Discovers SOAR multi-tenant environments and inspects their bound Data Access Scopes.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_environment_scopes`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/siem/data_tables": "# SIEM Data Tables & Lookup Lists\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SIEM Data Tables & Lookup Lists within secops_siem.\n\n## 2. Capabilities & SDK Workflows\n### `data_table.list`\n- **Description:** Lists all structured Data Tables defined in Chronicle SIEM.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_data_tables`\n\n### `data_table.get`\n- **Description:** Retrieves schema, columns, TTL, and metadata for a Chronicle SIEM Data Table.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_data_table`\n\n### `data_table.create`\n- **Description:** Creates a new structured Data Table with typed column definitions in Chronicle SIEM.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `create_data_table`\n\n### `data_table.patch`\n- **Description:** Updates description, TTL, or scope info of an existing Chronicle SIEM Data Table.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `patch_data_table`\n\n### `data_table.delete`\n- **Description:** Deletes a structured Data Table from Chronicle SIEM.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `delete_data_table`\n\n### `data_table.list_rows`\n- **Description:** Queries and filters rows contained within a Chronicle SIEM Data Table.\n- * l supported feed source types and collection mechanisms.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_feed_source_type_schemas`\n\n### `feed_schema.list_log_types`\n- **Description:** Lists log types supported by a specific feed source with lean payload handling.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_feed_log_type_schemas`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/siem/native_dashboards": "# SIEM Native Dashboards & Health Hub Telemetry\n\n## 1. Feature Purpose & Scope\nGoogle SecOps provides Looker-backed native dashboards that expose tenant operational metrics, including ingestion velocity, parser health, and search execution performance. AI agents invoke dashboard queries to retrieve aggregated telemetry without executing expensive ad-hoc raw log scans.\n\n## 2. Underlying APIs & SDK Primitives\n- **Fetch Dashboard Specification:** `dashboard.get` (`GET v1alpha/{parent}/dashboards/{dashboard_id}`)\n- **Execute Dashboard Tile Query:** `dashboard.execute_query` (`POST v1alpha/{parent}/dashboards:executeQuery`)\n- **UDM Aggregate Stats:** `search.udm.stats` (`POST v1alpha/{parent}:searchUdmStats`)\n\n## 3. Input Parameters & Constraints\n- **Dashboard ID:** Prebuilt system dashboards use reserved IDs (e.g., `health_hub`).\n- **Execution Filter:** Requires a valid Looker filter string or time range window (e.g., `last 7 days`).\n- **Cardinality:** Bounded aggregate result sets returning structured row lists.\n\n## 4. Telemetry & Observable Metrics\n- `p50_query_latency_ms`: Median execution duration for interactive UDM searches.\n- `p95_query_latency_ms`: 95th percentile latency identifying query tail degradation.\n- `failed_query_count`: Count of searches failing due to timeout, syntax errors, or quota exhaustion.", "features/siem/parser_lifecycle": "# Log Parsers & CBN Normalization\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to Log Parsers & CBN Normalization within secops_siem.\n\n## 2. Capabilities & SDK Workflows\n### `parser.log_types.list`\n- **Description:** Discovers and filters supported ingestion log types cataloged in Google SecOps.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_log_types`\n\n### `parser.search`\n- **Description:** Discovers and filters parsers across log types with creator and state filters.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_parsers`\n\n### `parser.get`\n- **Description:** Retrieves complete parser metadata and decoded Logstash CBN filter code.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_parser`\n\n### `parser.run`\n- **Description:** Executes a Logstash CBN parser configuration against a raw log string.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `run_parser`\n\n### `parser.diagnose_unparsed`\n- **Description:** Finds unparsed raw logs for a log type and runs them against the active parser to diagnose errors.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `diagnose_unparsed_logs`\n\n### `parser.extensions.search`\n- **Description:** Discovers parser extensions and dynamic parsing configurations across log types.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_parser_extensions`\n\n### `parser.extensions.get`\n- **Description:** Retrieves full parser extension configuration, decoded snippet, and test log.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_parser_extension`\n\n### `parser.log_type_setting.get`\n- **Description:** Retrieves autonomous parsing settings and extraction type for a specific log type.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_log_type_setting`\n\n### `parser.audit_health`\n- **Description:** Audits and correlates SIEM parser states, CBN version drift, extension conflicts, and Health Hub telemetry.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `audit_parser_health`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/siem/rules_engine": "# YARA-L Detection Rules Engine\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to YARA-L Detection Rules Engine within secops_siem.\n\n## 2. Capabilities & SDK Workflows\n### `rule.list`\n- **Description:** Lists custom YARA-L detection rules in Chronicle SIEM.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_rules`\n\n### `rule.get`\n- **Description:** Retrieves full details and YARA-L logic of a detection rule.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_rule`\n\n### `rule.verify`\n- **Description:** Validates YARA-L 2.0 rule syntax against the Chronicle compiler.\n- **Kind:** `query` | **Cardinality:** `bounded`\n- **MCP Tool:** `verify_rule_text`\n\n### `rule.create`\n- **Description:** Creates a new YARA-L detection rule in Chronicle SIEM.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `create_rule`\n\n### `rule.patch`\n- **Description:** Updates the YARA-L logic of an existing detection rule.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `patch_rule`\n\n### `rule.delete`\n- **Description:** Deletes a custom detection rule from Chronicle SIEM.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `delete_rule`\n\n### `rule.revisions`\n- **Description:** Lists historical revisions and ot causes for closing cases.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_case_close_definitions`\n\n### `case_config.close_parameter.list`\n- **Description:** Discovers dynamic form fields and custom field schemas required when closing cases.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_case_close_dynamic_parameters`\n\n### `case_config.title_settings.get`\n- **Description:** Retrieves priority rules for automated SOAR case naming.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_case_title_settings`\n\n### `case_config.view.search`\n- **Description:** Discovers and filters layout view templates for Cases, Alerts, and Detections.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_case_views`\n\n### `case_config.view.get`\n- **Description:** Retrieves deep inspection of a specific view layout template and widget hierarchy.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_case_view`\n\n### `case_config.custom_field.search`\n- **Description:** Lists and filters custom typed fields across Case and Alert scopes.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_custom_fields`\n\n### `case_config.custom_field.get`\n- **Description:** Retrieves deep inspection of a single custom field definition and ordered option values.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_custom_field`\n\n### `case_config.calculated_field.search`\n- **Description:** Lists and filters calculated field formula definitions.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_calculated_fields`\n\n### `case_config.calculated_field.get`\n- **Description:** Retrieves deep inspection of a single calculated field definition.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_calculated_field`\n\n### `case_config.alert_grouping.rule.search`\n- **Description:** Discovers and filters SOAR alert grouping rules determining case clustering.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_alert_grouping_rules`\n\n### `case_config.alert_grouping.rule.get`\n- **Description:** Retrieves deep inspection of a single alert grouping rule including entity types and category details.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_alert_grouping_rule`\n\n### `case_config.alert_grouping.settings.get`\n- **Description:** Retrieves global SOAR alert grouping configuration parameters including timeframes and algorithms.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_alert_grouping_settings`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/soar/case_management": "# SOAR Case Management & Triage\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SOAR Case Management & Triage within secops_soar.\n\n## 2. Capabilities & SDK Workflows\n### `case.investigate`\n- **Description:** Aggregates case metadata, security alerts, involved entities, and analyst comments.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `investigate_case`\n\n### `case.comment`\n- **Description:** Adds structured analyst investigation comments to a SOAR case.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `add_case_comment`\n\n### `case.list_comments`\n- **Description:** Lists all analyst comments and AI assessment notes for a SOAR case.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_case_comments`\n\n### `case.get_wall`\n- **Description:** Retrieves the complete SOAR case activity stream including status changes, tag updates, and playbook execution steps.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `get_case_wall`\n\n### `case.update`\n- **Description:** Mutates case attributes such as assignee, stage, incident flag, or priority.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `update_case`\n\n### `case.assign`\n- **Description:** Assigns a SOAR case to a SOC role (@Role) or user GUID.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `assign_case`\n\n### `case.set_stage`\n- **Description:** Updates the lifecycle stage of a SOAR case.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `set_case_stage`\n\n### `case.set_incident`\n- **Description:** Marks or unmarks a SOAR case as an incident.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `set_case_incident`\n\n### `case_alert.update`\n- **Description:** Mutates case alert attributes such as priority or status.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `update_case_alert`\n\n### `case_alert.set_priority`\n- **Description:** Updates the priority level of a specific case alert.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `set_case_alert_priority`\n\n### `case_alert.create_recommendation`\n- **Description:** Initiates asynchronous generation of a Gemini AI recommendation for a case alert.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `create_case_alert_recommendation`\n\n### `case_alert.fetch_recommendation`\n- **Description:** Fetches a previously generated Gemini AI recommendation for a case alert by recommendation ID.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `fetch_case_alert_recommendation`\n\n### `case_alert.get_recommendation`\n- **Description:** End-to-end workflow to trigger Gemini AI recommendation generation and poll until completion or failure.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `get_case_alert_recommendation`\n\n### `case.get_or_create_summary`\n- **Description:** Gets or initiates generation of a Gemini AI-driven overview, reasons, and next steps for a SOAR case.\n- **Kind:** `primitive` | **Cardinality:** `none`\n- **MCP Tool:** `get_or_create_case_summary`\n\n### `case.get_summary`\n- **Description:** Requests Gemini AI case summary and polls until generation is complete or timeout.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `get_case_summary`\n\n### `case.search`\n- **Description:** Searches, lists, and filters SOAR cases across time ranges, status, priority, and stages.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_cases`\n\n### `case.orchestrate_triage`\n- **Description:** Batched retrieval, parallel investigation, and automated initial triage assessment for SOAR cases.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `orchestrate_case_triage`\n\n### `case.triage`\n- **Description:** End-to-end single case triage: deep investigation, Gemini AI summary, title and entity precedent correlation, novelty assessment, and stage transitions.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `triage_case`\n\n### `case.timeline`\n- **Description:** Synthesizes a chronologically ordered event timeline across Case Creation, Alert Detections, Playbook Milestones, Analyst Comments, and Case Updates.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `get_case_timeline`\n\n### `case.ai_investigate`\n- **Description:** Executes deep AI-driven case investigation: fetches AI summary, extracts network and user indicators, runs automated UDM searches across Chronicle event logs, and assesses enterprise impact.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `ai_investigate_case`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/soar/integrations": "# SOAR Connectors & Third-Party Integrations\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SOAR Connectors & Third-Party Integrations within secops_soar.\n\n## 2. Capabilities & SDK Workflows\n### `integration.search`\n- **Description:** Searches, lists, and filters SOAR integrations across environments, status, and certification.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_integrations`\n\n### `integration.get`\n- **Description:** Retrieves complete integration details, instances, remote agents, and documentation.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_integration`\n\n### `integration.instances`\n- **Description:** Lists configured integration instances across environments or specific integrations.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_integration_instances`\n\n### `integration.remote_agents`\n- **Description:** Lists remote proxy execution agents and their supported environments.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_remote_agents`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/soar/playbooks": "# SOAR Playbooks & Automation Runs\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SOAR Playbooks & Automation Runs within secops_soar.\n\n## 2. Capabilities & SDK Workflows\n### `playbook.search`\n- **Description:** Searches, lists, and filters SOAR playbooks across categories, triggers, and environments.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_playbooks`\n\n### `playbook.get`\n- **Description:** Retrieves complete playbook definition, trigger conditions, and step execution DAG.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_playbook`\n\n### `playbook.categories`\n- **Description:** Lists all SOAR Playbook folder categories.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_playbook_categories`\n\n### `playbook.instances`\n- **Description:** Retrieves authoritative per-alert playbook run instances and the executed step DAG.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `get_alert_playbook_instances`\n\n### `playbook.audit_health`\n- **Description:** Audits SOAR playbooks and modular blocks for configuration hygiene, failure spikes, faulted actions, and queue latency using native Playbook Dashboard analytics.\n- **Kind:** `workflow` | **Cardinality:** `none`\n- **MCP Tool:** `audit_soar_playbook_health`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "features/soar/soar_settings": "# SOAR Global Settings & Environments\n\n## 1. Feature Purpose & Scope\nProvides programmatic operational access to SOAR Global Settings & Environments within secops_soar.\n\n## 2. Capabilities & SDK Workflows\n### `soar.user.search`\n- **Description:** Discovers and filters SOAR users and external identity profiles.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_users`\n\n### `soar.user.get`\n- **Description:** Retrieves deep profile details of a single SOAR user including roles, permission groups, and environment access.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_user`\n\n### `soar.soc_role.list`\n- **Description:** Lists configured SOC roles and workflow assignment access hierarchy.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `list_soc_roles`\n\n### `soar.company.get`\n- **Description:** Retrieves tenant branding, report customizations, and system email settings.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_company_settings`\n\n### `soar.data_retention.get`\n- **Description:** Retrieves SOAR data retention configuration and per-environment policy settings.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_data_retention_settings`\n\n### `soar.environment.search`\n- **Description:** Discovers and filters multi-tenancy environment boundaries within the SOAR tenant.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_environments`\n\n### `soar.environment.get`\n- **Description:** Retrieves deep configuration details of a single multi-tenancy environment.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_environment`\n\n### `soar.environment_group.search`\n- **Description:** Discovers and lists logical groupings of multi-tenancy environments.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_environment_groups`\n\n### `soar.remote_agent.search`\n- **Description:** Discovers and filters remote execution agents, bindings, and active health states.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_remote_agents`\n\n### `soar.remote_agent.get`\n- **Description:** Retrieves deep configuration of a remote agent including certificates and installer links.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_remote_agent`\n\n### `soar.email_settings.get`\n- **Description:** Retrieves composite email transport configuration combining custom SMTP and Google defaults.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_email_settings`\n\n### `soar.support_settings.get`\n- **Description:** Retrieves Google Support access delegation parameters including roles, environments, and expiry.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_support_settings`\n\n### `soar.network.search`\n- **Description:** Discovers and filters customer-defined CIDR network address ranges and environment mappings.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_networks`\n\n### `soar.network.get`\n- **Description:** Retrieves complete configuration for a single customer-defined CIDR network.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_network`\n\n### `soar.domain.search`\n- **Description:** Discovers and filters customer-approved domain names and environment mappings.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_domains`\n\n### `soar.domain.get`\n- **Description:** Retrieves complete configuration for a single approved customer domain.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_domain`\n\n### `soar.custom_list.search`\n- **Description:** Discovers and filters SOAR custom key-value style retention lists by query, category, and environment.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_custom_lists`\n\n### `soar.custom_list.get`\n- **Description:** Retrieves complete configuration for a single SOAR custom list record.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_custom_list`\n\n### `soar.email_template.search`\n- **Description:** Discovers and filters plain text and HTML email templates used in SOAR playbooks.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_email_templates`\n\n### `soar.email_template.get`\n- **Description:** Retrieves complete email template definition including markup and body content.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_email_template`\n\n### `soar.entities_blocklist.search`\n- **Description:** Discovers and filters entity extraction noise-reduction blocklists.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_entities_blocklists`\n\n### `soar.entities_blocklist.get`\n- **Description:** Retrieves complete configuration for a single entity blocklist entry.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_entities_blocklist`\n\n### `soar.sla_definition.search`\n- **Description:** Discovers and filters Service Level Agreement definitions across stages and priorities.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_sla_definitions`\n\n### `soar.sla_definition.get`\n- **Description:** Retrieves complete SLA parameters for a single SLA rule.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_sla_definition`\n\n### `soar.request_template.search`\n- **Description:** Discovers and filters SOAR manual case request form templates.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_request_templates`\n\n### `soar.request_template.get`\n- **Description:** Retrieves complete form field definitions and options for a single request template.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_request_template`\n\n### `soar.ingestion_connector.search`\n- **Description:** Discovers and filters configured SOAR ingestion connector instances across integrations.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_ingestion_connectors`\n\n### `soar.ingestion_connector.get`\n- **Description:** Retrieves complete configuration for a single SOAR ingestion connector instance.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_ingestion_connector`\n\n### `soar.webhook.search`\n- **Description:** Discovers and filters configured SOAR event ingestion webhooks.\n- **Kind:** `query` | **Cardinality:** `unbounded`\n- **MCP Tool:** `search_soar_webhooks`\n\n### `soar.webhook.get`\n- **Description:** Retrieves complete configuration and schema mapping for a single SOAR event ingestion webhook.\n- **Kind:** `query` | **Cardinality:** `single`\n- **MCP Tool:** `get_soar_webhook`\n\n## 3. Operational Invariants & Constraints\n- All queries returning unbounded collections require explicit filtering.\n- Mutation capabilities must specify non-empty payloads and valid target IDs.\n\n## 4. Telemetry & Observable Health Indicators\n- Correlate changes against Native Dashboards and Health Hub.", "personas/detection_engineer": "# SecOps Detection Engineer\n\n## 1. Role Mandate & Core Objective\nThe Detection Engineer builds, tests, deploys, and tunes YARA-L detection rules. They maintain alignment with the MITRE ATT&CK matrix and monitor Google curated detection updates to eliminate detection blind spots.\n\n## 2. Operational Cadence\n- **Daily:** Review rule execution errors and alert volume spikes.\n- **Weekly:** Audit rule health, zero-match rules, and curated detection pack drift.\n\n## 3. Safety Guardrails & Autonomy Boundaries\n- **Autonomous Scope:** Validate rules, list revisions, audit execution health, test test-rules against historical UDM data.\n- **Approval Required:** Disabling production detection rules, modifying curated rule exclusion sets, editing alerting thresholds.", "personas/ingestion_specialist": "# SecOps Ingestion & Telemetry Specialist\n\n## 1. Role Mandate & Core Objective\nThe Ingestion Specialist owns log pipelines, telemetry forwarders, BindPlane collectors, and Chronicle feed health. They guarantee that all critical data sources ingest reliably, normalize cleanly into UDM, and stay within latency bounds.\n\n## 2. Operational Cadence\n- **Daily:** Audit failing feeds, ingestion latency spikes, and unparsed log volume.\n- **Weekly:** Review feed schema additions, collector agent versions, and parser compilation diagnostics.\n\n## 3. Safety Guardrails & Autonomy Boundaries\n- **Autonomous Scope:** Read feed configurations, run health audits, inspect parser errors, query telemetry dashboards.\n- **Approval Required:** Creating or modifying feed credentials, changing parser code in production, deleting log pipelines.", "personas/platform_engineer": "# SecOps & Cloud Platform Engineer\n\n## 1. Role Mandate & Core Objective\nThe Platform Engineer is responsible for the overall operational health, pipeline throughput, search responsiveness, and collector infrastructure across Google SecOps, BindPlane OP, and GCP. The engineer ensures that detection engineers and SOC analysts have an available, high-performing platform.\n\n## 2. Operational Cadence\n- **Daily:** Review ingestion latency trends and failing feeds.\n- **Weekly:** Audit UDM search performance, query failure rates, and collector rollouts.\n- **Incident-Triggered:** Investigate ingestion stalls, quota breaches, and sudden search degradation.\n\n## 3. Safety Guardrails & Autonomy Boundaries\n- **Autonomous Scope:** Can run all read, query, health audit, and diagnostic workflows autonomously.\n- **Approval Required:** Any configuration changes to ingestion pipelines, data retention, or connector mappings require review.\n\n## 4. Key Metrics Owned\n- Ingestion Latency (p95 < 2 hours)\n- Search Execution Performance (p95 < 15 seconds, query failure rate < 1%)\n- Feed & Collector Availability (> 99.5% healthy feeds)", "personas/soc_analyst": "# SOC Lead & Incident Response Operator\n\n## 1. Role Mandate & Core Objective\nThe SOC Lead oversees operational queue triage, alert prioritization, and incident response execution in Chronicle SOAR. They ensure cases are handled within SLA and playbooks execute without failure.\n\n## 2. Operational Cadence\n- **Continuous / Daily:** Triage unassigned critical/high cases, review playbook failure logs, monitor SLA countdowns.\n- **Weekly:** Review case closure metrics, root-cause tags, and false positive rates.\n\n## 3. Safety Guardrails & Autonomy Boundaries\n- **Autonomous Scope:** Query cases, trigger diagnostic triage assessments, view case walls and timelines.\n- **Approval Required:** Closing critical severity cases, executing destructive remediation actions (e.g. host isolation).", "tasks/detection_engineer/review_rule_health": "# Review Detection Rule Compilation, Execution Health, and Curated Drift\n\n## 1. Intent & Context\nAudit active YARA-L detection rules for execution timeouts, memory errors, zero-match anomalies, and review vendor-curated detection updates to ensure threat detection coverage remains high.\n\n## 2. Preconditions & Required Context\n- SecOps SIEM API credentials active.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Audit Custom Rule Execution Health\nInvoke `rule.audit_health`:\n- Checks for compiler diagnostic errors, execution failure spikes, and latency drift.\n\n### Step 2: Audit Curated Detections Health\nInvoke `curated_detections.audit_health`:\n- Reviews enablement rates across MITRE ATT&CK categories and flags newly retired or updated rule packs.\n\n### Step 3: Evaluate Against Thresholds\n- **Healthy:** 0 runtime execution errors, curated rule enablement >= 60%.\n- **Warning:** Curated rule retirement delta > 5 rules, or rules approaching execution timeouts.\n- **Critical:** Any production rule failing repeatedly with runtime errors.\n\n## 4. Remediation & Escalation Runbook\n- For runtime errors: Examine the rule YARA-L syntax via `rule.list` and tune match window conditions.\n- For retired curated rules: Identify if customer custom rules need to be authored to replace retired logic.", "tasks/ingestion_specialist/audit_feed_health": "# Audit Feed Connectivity, Ingestion Latency, and Error States\n\n## 1. Intent & Context\nEnsure that all push and pull feeds in Google SecOps are transmitting logs cleanly without authentication failures, transport errors, or ingestion latency drift.\n\n## 2. Preconditions & Required Context\n- Tenant must be initialized with authorized SecOps credentials.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Run Proactive Feed Health Audit\nInvoke SDK capability `feed.audit_health`:\n- Evaluates configured feeds against Health Hub telemetry and Deep Dive metrics.\n- Returns list of unhealthy feeds, severity classifications, and error messages.\n\n### Step 2: Investigate Specific Unhealthy Feeds\nFor each feed reported in `UNHEALTHY` or `DEGRADED` state:\n- Invoke `feed.get` to retrieve feed state, last initiation time, and failure details.\n\n### Step 3: Evaluate Against Thresholds\n- **Healthy:** 0 failing feeds, latency < 2.0 hours.\n- **Warning:** Latency between 2.0 and 4.0 hours, or single non-critical feed degraded.\n- **Critical:** Any primary feed (e.g. EDR, Cloud Audit) failing or latency > 4.0 hours.\n\n## 4. Remediation & Escalation Runbook\n- If feed failed due to expired credentials (e.g. AWS S3 IAM Role, Azure Client Secret), notify platform owner to rotate secrets.\n- If feed is healthy but latency is elevated, check upstream forwarder queues or BindPlane collectors.", "tasks/ingestion_specialist/manage_bindplane_rollout": "# Verify BindPlane Collector Pipeline and Downstream Ingestion Health\n\n## 1. Intent & Context\nSafely verify that telemetry collected by BindPlane OP OpenTelemetry agents successfully reaches Google SecOps feeds without pipeline drops or latency spikes during configuration updates.\n\n## 2. Preconditions & Required Context\n- Access to SecOps SIEM Ingestion APIs.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Audit Downstream Feed Health\nInvoke `feed.audit_health`:\n- Inspect latency and error metrics across all Chronicle feeds receiving BindPlane telemetry.\n\n### Step 2: Correlate Ingestion Velocity\nInvoke `feed.search` to verify that feed state is `ACTIVE` and initiation timestamps are progressing normally.\n\n### Step 3: Evaluate Against Thresholds\n- **Healthy:** Latency < 2.0 hours, 0 feed transport errors.\n- **Warning:** Ingestion latency between 2.0 and 4.0 hours during rollout window.\n- **Critical:** Feed dropped to `FAILED` or latency > 4.0 hours, indicating collector pipeline stall.\n\n## 4. Remediation & Escalation Runbook\n- If latency spikes post-rollout, pause the rollout and review processor batch timeout settings.", "tasks/platform_engineer/audit_identity_access": "# Audit Workforce Identity Federation and Admin Role Assignments\n\n## 1. Intent & Context\nEnsure that all administrative access granted through GCP Workforce Identity Pools adheres to least-privilege principles and that data access scopes properly restrict tenant compartment access.\n\n## 2. Preconditions & Required Context\n- Tenant initialized with Chronicle Admin credentials.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Inspect Effective RBAC Context\nInvoke `data_rbac.environment.search`:\n- Retrieve active scopes, tenant-level data labels, and role mappings.\n\n### Step 2: Query Data Access Scopes\nInvoke `data_rbac.scope.search`:\n- Verify that restricted data scopes (e.g. PCI-DSS, Executive telemetry) are properly bound to authorized groups.\n\n### Step 3: Evaluate Against Thresholds\n- **Healthy:** All admin principals belong to verified workforce pool groups; 0 unassigned data scopes.\n- **Warning:** New workforce group added without documented change ticket.\n- **Critical:** Discovered direct IAM role assignment bypassing the workforce pool.\n\n## 4. Remediation & Escalation Runbook\n- If unauthorized admin accounts are detected, escalate to the Identity Governance team and revoke session credentials.", "tasks/platform_engineer/audit_tenant_configuration_posture": "# Audit Tenant Configuration Posture & Drift\n\n## 1. Intent & Context\nContinuously audit, baseline, and verify the configuration posture across Google SecOps SIEM and SOAR. Ensure that high-risk posture changes (e.g. reduction in data retention, unintended Google support delegation, disabling of Gemini autonomous triage, or alteration of alert grouping windows) are immediately identified as configuration drift and flagged for governance review.\n\n## 2. Preconditions & Required Context\n- Tenant initialized with active Chronicle SIEM and SOAR instance.\n- Access to SecOpsEngine with valid credentials and Evidence Fabric store.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Snapshot Current Tenant Baseline\nExecute the comprehensive tenant posture audit:\n- Query Root Instance details, state, and feature flags.\n- Query Gemini AI Agent triage configuration and alert filter expressions.\n- Query UEBA risk scoring parameters and coefficients.\n- Query Data Processing Pipelines, managed domains, and RBAC scopes.\n- Query SOAR global settings (data retention, company parameters, email transport, support delegation).\n- Query SOC topography (SOC roles, environments, remote agents, networks, domains, custom lists).\n\n### Step 2: Retrieve Historical Baseline\n- Query Evidence Fabric (`tenant_baselines`) for the latest approved baseline or golden standard.\n\n### Step 3: Compute Configuration Drift\n- Compare current snapshot against the baseline using cryptographic subsystem fingerprinting and recursive diffing.\n- Categorize changes by severity (`CRITICAL`, `HIGH`, `MEDIUM`, `LOW`).\n\n### Step 4: Evaluate Against Governance Thresholds\n- **Healthy:** 0 drift detected compared to golden standard; data retention and RBAC intact.\n- **Warning:** Low or medium drift detected (e.g. display name update, new remote agent registered, or non-security email template update).\n- **Critical:** Critical posture drift detected (e.g. data retention period reduced, Google support access delegation enabled, Gemini autonomous triage turned off, or alert grouping timeframe altered).\n\n## 4. Remediation & Escalation Runbook\n- For critical configuration drift, automatically generate an actionable task (`add_todo`) in the Evidence Fabric assigned to `@tenant-posture-agent`.\n- Notify the Platform Engineer and SOC Manager with the parameter diff and prior timestamp.", "tasks/platform_engineer/check_udm_search_performance": "# Check UDM Search Performance and Error Rates\n\n## 1. Intent & Context\nAssess the operational responsiveness and reliability of interactive UDM search across the tenant. Detect whether query latency has degraded, timeouts are spiking, or users are issuing unindexed scans that impact tenant performance.\n\n## 2. Preconditions & Required Context\n- Tenant must be onboarded with SecOps API credentials (ADC or Service Account).\n- Health Hub or Native Dashboard query capability must be accessible.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Query Search Performance Metrics\nInvoke `dashboard.execute_query` targeting the Health Hub dashboard:\n- Query: Retrieve search count, median latency (`p50`), 95th percentile latency (`p95`), and total failed queries over the last 7 days.\n\n### Step 2: Correlate with Ingestion Stats\nInvoke `search.udm.stats` to check if event volume shifts coincide with query performance degradation.\n\n### Step 3: Evaluate Health Against Thresholds\n- **Healthy:** Failure rate < 1.0% and p95 latency < 15,000 ms.\n- **Warning:** p95 latency >= 15,000 ms or failure rate between 1.0% and 5.0%.\n- **Critical:** Failure rate >= 5.0% or continuous query timeouts.\n\n## 4. Remediation & Escalation Runbook\n- If high failure rate is caused by unindexed scans, identify the originating user accounts or automation scripts and provide query optimization guidance.\n- If high failure rate is due to backend quota limits, file an operational escalation to adjust Google SecOps API quota allocations.", "tasks/platform_engineer/monitor_chronicle_gcp_telemetry": "# Monitor Chronicle GCP Logging and Metrics Telemetry\n\n## 1. Intent & Context\nContinuously evaluate Google Cloud Logging and Google Cloud Monitoring time series to detect Chronicle ingestion anomalies, normalizer stalls, API consumption spikes, forwarder errors, and administrative audit events across the Google Cloud project.\n\n## 2. Preconditions & Required Context\n- Google Cloud project ID for the Chronicle tenant.\n- Service account or ADC with `roles/logging.viewer` and `roles/monitoring.viewer`.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Query Chronicle Health Metrics\nInvoke `gcp_monitoring.time_series` to retrieve recent telemetry:\n- Ingestion metrics: `chronicle.googleapis.com/collector/ingestion/total_ingested_log_count`\n- Normalizer metrics: `chronicle.googleapis.com/normalizer/throughput/total_record_count`\n- API metrics: `serviceruntime.googleapis.com/api/request_count` for service `chronicle.googleapis.com`\n\n### Step 2: Query Cloud Logging for Error Events\nInvoke `gcp_logging.search` to inspect error logs over the same time window:\n- Filter: `severity >= ERROR AND (resource.type = \"chronicle.googleapis.com/...\" OR logName : \"cloudaudit.googleapis.com\")`\n- Extract error messages, failure codes, and impacted forwarder agents or users.\n\n### Step 3: Correlate and Evaluate Findings\n- Check whether ingestion drops align with forwarder error logs or network disconnections.\n- Verify whether API request surges triggered HTTP 429 quota exhaustion.\n\n## 4. Remediation & Escalation Runbook\n- If forwarder error logs indicate TLS handshake failure, instruct the infrastructure team to renew certificates.\n- If normalizer drops are detected, engage `@parser-doctor` to review CBN parser syntax.\n- If API quotas are exceeded, alert the platform administrator to request a quota increase.", "tasks/soc_analyst/audit_soar_playbook_decay": "# Audit SOAR Playbook Inventory, Resilience Scoring & Decay\n\n## 1. Intent & Context\nContinuously audit Google SecOps SOAR playbooks and modular nested blocks for configuration hygiene, static topology resilience, and 30-day runtime failure rates. Identify silent containment failures, missing connector retries, and abandoned automation workflows.\n\n## 2. Preconditions & Required Context\n- Live Google SecOps SOAR instance and Chronicle dashboard telemetry access.\n- Read/Write access to Firestore collection `soar_playbooks` in Evidence Fabric.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Discover Active Playbooks and DAG Topologies\nInvoke `playbook.search` and `playbook.get` to ingest active playbooks, step definitions, and transition edges.\n\n### Step 2: Evaluate 100-Point Resilience Scoring Engine\nEvaluate the 15 deterministic scoring rules:\n- **HYG-01**: Production Hygiene (Active + Debug Mode)\n- **ERR-01..04**: Action retries, enrichment hard-stops, silent containment failure, and single points of failure.\n- **PRIO-01..03**: Shadowing risk, global interception, and master orchestrators.\n- **MAINT-01..02**: Lifecycle decay and un-tuned playbooks.\n- **HITL-01, HITL-OBS**: Human approval SLA timeouts and governance safeguards.\n\n### Step 3: Correlate 30-Day Chronicle Telemetry\nQuery Chronicle `dashboardQueries:execute` over 30 days to compute total runs, failure rates, and execution durations.\n\n### Step 4: Generate Mermaid.js DAG & Synthesize GenAI Architectural Narrative\nGenerate interactive Mermaid flowchart and invoke Gemini to produce the 4-part architectural executive brief:\n1. Strategic Intent & Trigger Scope\n2. Investigation & Data Pipeline\n3. Decision Branches & Human-in-the-Loop Governance\n4. Automated Containment & Case Resolution\n\n### Step 5: Persist Audit Reports to Firestore\nPersist audited playbooks with 1MB sanitization safeguard into collection `soar_playbooks` for multi-agent evidence sharing.\n\n## 4. Remediation & Escalation Runbook\n- If resilience score < 70 (Grade D or F) or failure rate > 20%, open remediation task in Evidence Fabric.\n- For `HYG-01`, disable debug mode immediately on active playbooks.\n- For `ERR-03`, disable auto-skip on critical containment actions and add faulted branch escalation.", "tasks/soc_analyst/triage_high_priority_cases": "# Triage High-Priority Cases and Monitor Playbook Execution\n\n## 1. Intent & Context\nReview open Critical and High severity cases in Chronicle SOAR, verify automated playbook execution success, and assess cases at risk of SLA breach.\n\n## 2. Preconditions & Required Context\n- Access to Chronicle SOAR API.\n\n## 3. Step-by-Step Execution Procedure\n\n### Step 1: Query Open High-Priority Cases\nInvoke `case.search` with filter:\n- Priority: `CRITICAL` or `HIGH`\n- Status: `OPEN` or `IN_PROGRESS`\n\n### Step 2: Execute Automated Triage Assessment\nFor unassigned cases, invoke `case.triage` to obtain triage verdicts, precedent case comparisons, and entity reputation summaries.\n\n### Step 3: Audit Playbook Execution Health\nInvoke `playbook.audit_health` to verify that enrichment and containment actions completed successfully without connector timeout.\n\n## 4. Remediation & Escalation Runbook\n- If a case SLA has < 30 minutes remaining, immediately escalate to the on-call incident commander.\n- If playbook failed due to connector error, inspect connector credentials in `feature.soar.integrations`."}, "types": ["Attested Computation", "concept", "feature", "persona", "task"], "palette": {"concept": "#8b5cf6", "feature": "#3b82f6", "persona": "#f59e0b", "task": "#10b981", "computation": "#ef4444", "Attested Computation": "#ef4444", "skill": "#ec4899"}};
(function() {
  const data = window.GRAPH_DATA;
  const typeSelect = document.getElementById("filter-type");
  for (const t of data.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t.toUpperCase();
    typeSelect.appendChild(opt);
  }

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...data.nodes, ...data.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#f8fafc",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 5,
          "text-wrap": "wrap",
          "text-max-width": 110,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 2,
          "border-color": "#ffffff",
          "text-background-color": "#0b0f19",
          "text-background-opacity": 0.8,
          "text-background-padding": 2,
          "text-background-shape": "roundrectangle"
        }
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 4,
          "border-color": "#38bdf8",
          "width": "mapData(size, 20, 80, 35, 95)",
          "height": "mapData(size, 20, 80, 35, 95)"
        }
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#475569",
          "target-arrow-color": "#475569",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.8
        }
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#38bdf8",
          "target-arrow-color": "#38bdf8",
          "width": 2.5
        }
      }
    ],
    layout: { name: "cose", padding: 30, animate: false }
  });

  function showDetail(node) {
    const d = node.data();
    document.getElementById("detail-empty").style.display = "none";
    const cont = document.getElementById("detail-content");
    cont.style.display = "block";

    document.getElementById("detail-type").textContent = d.type;
    document.getElementById("detail-type").style.backgroundColor = d.color;
    document.getElementById("detail-title").textContent = d.label;
    document.getElementById("detail-id").textContent = d.id;
    document.getElementById("detail-desc").textContent = d.description || "—";
    
    // Trust badge
    const trustEl = document.getElementById("detail-trust");
    trustEl.textContent = d.trust_tier.toUpperCase();
    trustEl.className = "trust-badge trust-" + (d.trust_tier === "human-reviewed" ? "human" : d.trust_tier === "machine-confirmed" ? "machine" : "unverified");

    // Tags
    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = (d.tags || []).map(t => `<span class="tag-badge">${t}</span>`).join("") || "—";

    document.getElementById("detail-status").textContent = d.status || "stable";
    document.getElementById("detail-stale").textContent = d.stale_after || "—";
    
    // Generated
    const gen = d.generated;
    document.getElementById("detail-gen").textContent = gen && gen.by ? `${gen.by} (${gen.at || ""})` : "—";

    // Verified
    const ver = d.verified;
    document.getElementById("detail-ver").textContent = ver && ver.length ? ver.map(v => `${v.by} (${v.at || ""})`).join(", ") : "Unverified";

    // Sources
    const src = d.sources;
    document.getElementById("detail-src").innerHTML = src && src.length ? src.map(s => `<a href="${s.resource}" target="_blank" rel="noopener">${s.title || s.resource}</a>`).join("<br>") : "—";

    // Markdown body
    const bodyMarkdown = data.bodies[d.id] || "";
    document.getElementById("detail-body").innerHTML = marked.parse(bodyMarkdown);
  }

  window.cy = cy;
  window.showDetail = showDetail;

  cy.on("tap", "node", e => showDetail(e.target));

  // Auto-select initial node on load
  const initialNode = cy.getElementById("computations/feed_timestamp_skew");
  if (initialNode && initialNode.length) {
    initialNode.select();
    showDetail(initialNode);
  } else if (cy.nodes().length) {
    cy.nodes()[0].select();
    showDetail(cy.nodes()[0]);
  }

  // Search filter
  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      cy.nodes().show();
      return;
    }
    cy.nodes().forEach(n => {
      const d = n.data();
      const match = d.label.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || (d.tags || []).some(t => t.toLowerCase().includes(q));
      match ? n.show() : n.hide();
    });
  });

  // Type filter
  typeSelect.addEventListener("change", e => {
    const val = e.target.value;
    if (!val) {
      cy.nodes().show();
      return;
    }
    cy.nodes().forEach(n => {
      n.data("type") === val ? n.show() : n.hide();
    });
  });

  // Layout change
  document.getElementById("layout").addEventListener("change", e => {
    cy.layout({ name: e.target.value, animate: true, animationDuration: 500 }).run();
  });

  // Reset view
  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
  });
})();
</script>
</body>
</html>
