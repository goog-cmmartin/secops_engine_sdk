schema_version: "1.0.0"
workflow_id: "case_config.alert_grouping.rule.search"
title: "Search Alert Grouping Rules"
description: "Discovers and filters SOAR alert grouping rules determining how incoming detections are clustered into cases."

classification: VERIFIED

triggers:
  - type: manual
  - type: api_invocation

inputs:
  - name: query
    type: string
    required: false
    description: "Optional keyword search filter across rule name, category, or entity types."
  - name: category
    type: string
    required: false
    description: "Optional category filter (e.g., ALL, ALERT_TYPE, PRODUCT_NAME)."
  - name: limit
    type: integer
    required: false
    default: 100
    description: "Maximum number of grouping rules to return."

outputs:
  - name: rules
    type: array
    description: "List of alert grouping rule summaries."
  - name: total_count
    type: integer
    description: "Total number of rules discovered."

api_calls:
  - service: chronicle_v1alpha
    method: GET
    path: "/v1alpha/projects/{project_number}/locations/{location}/instances/{customer_id}/alertGroupingRules"
    params:
      pageSize: "{limit}"
