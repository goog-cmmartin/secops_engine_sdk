id: calculated-field-get-001
name: Calculated Field Deep Inspection
description: Retrieves deep inspection of a specific calculated field formula and target field definition.
version: 1.0.0

trigger:
  type: USER_ACTION
  action: case_config.calculated_field.get

inputs:
  definition_id:
    type: string
    required: true
    description: Numeric ID or resource name of the calculated field definition.

steps:
  - id: get_calculated_field
    action: api.secops.calculatedFieldDefinitions.get
    params:
      definitionId: "{{ inputs.definition_id }}"
    provenance:
      endpoint: "GET /v1alpha/projects/{project}/locations/{location}/instances/{instance}/calculatedFieldDefinitions/{definitionId}"

outputs:
  summary:
    type: object
    properties:
      id: string
      name: string
      targetField: string
      formula: string
      enabled: boolean
