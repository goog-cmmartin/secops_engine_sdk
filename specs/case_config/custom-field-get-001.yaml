id: custom-field-get-001
name: Custom Field Deep Inspection
description: Retrieves deep inspection of a single custom field definition including ordered choice values.
version: 1.0.0

trigger:
  type: USER_ACTION
  action: case_config.custom_field.get

inputs:
  field_id:
    type: string
    required: true
    description: Numeric ID or resource name of the custom field (e.g. 7).

steps:
  - id: get_custom_field
    action: api.secops.customFields.get
    params:
      fieldId: "{{ inputs.field_id }}"
    provenance:
      endpoint: "GET /v1alpha/projects/{project}/locations/{location}/instances/{instance}/customFields/{fieldId}"

outputs:
  summary:
    type: object
    properties:
      id: string
      name: string
      displayName: string
      type: string
      scopes: string
  ordered_values:
    type: array
    items:
      type: object
      properties:
        value: string
        orderIndex: integer
