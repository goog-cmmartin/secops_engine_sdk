id: job.logs
version: 1.0.0
title: SOAR Job Instance Execution Logs Retrieval
description: >
  Retrieves execution run records and logs for a specific SOAR job instance.
category: job
status: VERIFIED
provenance:
  api_path: /v1alpha/projects/{project}/locations/{location}/instances/{instance}/integrations/-/jobs/-/jobInstances/{job_instance_id}/logs
  method: GET
  auth: ADC Bearer Token
  cache_policy: LIVE_DYNAMIC

inputs:
  job_instance_id:
    type: string
    required: true
    description: Unique numeric identifier of the job instance (e.g. 80).
  limit:
    type: integer
    default: 20
    description: Maximum number of execution log entries to return.
  order_by:
    type: string
    default: "endTime desc"
    description: Sorting order for execution logs.

outputs:
  logs:
    type: list[JobExecutionLog]
    items:
      name: string
      start_time: string
      end_time: string
      status: string
      log_text: string
      job_identifier: string
      integration: string
      job_instance_id: string

invariants:
  - Strict origin of production data from live Google SecOps endpoints.
  - Zero synthetic or simulated data structures.
  - Live execution timestamp and status validation.
