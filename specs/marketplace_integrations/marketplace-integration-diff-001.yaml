schema_version: "1.0.0"
workflow_id: "marketplace_integration.diff"
title: "Get Content Hub Marketplace Commercial Diff"
description: "Retrieves the commercial version diff between the installed version and target marketplace version, identifying overridden and added actions/managers."

invariants:
  strict_origin: true
  zero_synthetic_data: true
  error_visibility: true

triggers:
  - type: "MANUAL_OR_AGENT"
    description: "Invoked prior to upgrading or modifying an integration to evaluate changes."

inputs:
  identifier:
    type: "string"
    required: true
    description: "Integration identifier or display title (e.g. 'Wiz' or 'PubSub')."

outputs:
  diff:
    type: "MarketplaceCommercialDiff"
    description: "Structure describing version difference, action overrides, and manager module additions."

steps:
  - id: "fetch_commercial_diff"
    action: "adapters.google_secops.get_marketplace_integration_diff"
    description: "Calls :fetchCommercialDiff on the marketplace integration resource."
