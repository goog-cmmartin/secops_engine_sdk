schema_version: "1.0.0"
workflow_id: "marketplace_integration.get"
title: "Get Content Hub Marketplace Response Integration Details"
description: "Deep-inspects a Marketplace Response Integration, extracting bundled actions, connectors, scheduled jobs, manager modules, changelogs, and version snapshots."

invariants:
  strict_origin: true
  zero_synthetic_data: true
  error_visibility: true

triggers:
  - type: "MANUAL_OR_AGENT"
    description: "Invoked to inspect full composite details of a specific response integration."

inputs:
  identifier:
    type: "string"
    required: true
    description: "Integration identifier, resource name, or display title (e.g. 'Wiz' or 'SentinelOneSingularityOperationsCenter')."

outputs:
  detail:
    type: "MarketplaceIntegrationDetail"
    description: "Complete response integration composite with bundled components and release notes."

steps:
  - id: "resolve_and_fetch"
    action: "adapters.google_secops.get_marketplace_integration"
    description: "Fetch integration by identifier from live Google SecOps marketplace endpoint."
