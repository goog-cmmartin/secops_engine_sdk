name: soar-network-get-v1
version: "1.0.0"
description: "Retrieves complete configuration for a single customer-defined CIDR network."
category: soar_settings
inputs:
  network_id:
    type: string
    required: true
    description: "Numeric identifier or resource name of the network."
outputs:
  summary:
    id: string
    name: string
    display_name: string
    address: string
    environments: array
    priority: integer
  raw: object
